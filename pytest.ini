# pytest.ini
# ==========
# Configuration for pytest (the test runner).
#
# pythonpath = .    -> adds the project root to Python's import path, so test
#                      files can write "from compiler.lexer import tokenize".
# testpaths = tests -> only look for tests inside the tests/ folder.
# addopts           -> extra options applied to every pytest run:
#   --basetemp=.pytest_tmp  keeps the temporary folders that the tmp_path
#                           fixture creates INSIDE the project, instead of the
#                           system Temp folder (avoids Windows permission
#                           errors on %TEMP%\pytest-of-<username>).
#                           pytest empties this folder at the start of each run.

[pytest]
pythonpath = .
testpaths = tests
addopts = --basetemp=.pytest_tmp
